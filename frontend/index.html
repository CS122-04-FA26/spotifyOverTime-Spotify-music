<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spotify Over Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1DB954;
    --dark: #121212;
    --panel: #181818;
    --panel-light: #282828;
    --text: #ffffff;
    --muted: #b3b3b3;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Poppins', Helvetica, Arial, sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  h1 {
    font-size: 2.1rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 36px;
    text-align: center;
  }
  .card {
    background: var(--panel);
    border-radius: 8px;
    padding: 32px;
    width: 100%;
    max-width: 520px;
  }
  label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 8px;
    margin-top: 20px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 4px;
    border: 1px solid #3e3e3e;
    background: var(--panel-light);
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--green);
  }
  .file-upload {
    border: 1px solid #3e3e3e;
    border-radius: 4px;
    padding: 18px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .file-upload:hover { border-color: var(--green); }
  .file-upload.has-file { border-color: var(--green); color: var(--text); }
  .file-upload input[type="file"] { display: none; }
  .clear-file {
    display: none;
    margin-top: 6px;
    font-size: 0.78rem;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    text-align: right;
  }
  .clear-file.visible { display: block; }
  button {
    width: 100%;
    margin-top: 28px;
    padding: 14px;
    border: none;
    border-radius: 500px;
    background: var(--green);
    color: #000000;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s, opacity 0.2s;
  }
  button:hover:not(:disabled) { background: #1ed760; transform: scale(1.02); }
  button:disabled { opacity: 0.65; cursor: wait; }

  .error-box {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 6px;
    background: rgba(255, 107, 107, 0.12);
    border: 1px solid rgba(255, 107, 107, 0.4);
    color: var(--error);
    font-size: 0.88rem;
    display: none;
  }
  .error-box.visible { display: block; }

  .result-box {
    margin-top: 28px;
    padding: 24px;
    border-radius: 8px;
    background: var(--panel-light);
    display: none;
  }
  .result-box.visible { display: block; }
  .result-era {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 6px;
  }
  .result-sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 14px;
  }
  .result-para {
    font-size: 0.92rem;
    line-height: 1.55;
    margin-top: 16px;
    margin-bottom: 0;
  }
  .confidence-bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 7px 0;
    font-size: 0.85rem;
  }
  .confidence-label {
    width: 90px;
  }
  .confidence-pct {
    width: 42px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .confidence-bar-track {
    flex: 1;
    height: 8px;
    background: #253531;
    border-radius: 999px;
    overflow: hidden;
  }
  .confidence-bar-fill {
    height: 100%;
    background: var(--green);
    border-radius: 999px;
    transition: width 0.35s ease;
  }
</style>
</head>
<body>

  <h1>Spotify Over Time</h1>
  <p class="subtitle">Predict which era a song's sound belongs to</p>

  <div class="card">
    <label for="songSearch">Search by song name</label>
    <input type="text" id="songSearch" list="songSuggestions" placeholder="e.g. Blinding Lights" autocomplete="off" />
    <datalist id="songSuggestions"></datalist>

    <label>Or upload an audio file</label>
    <div class="file-upload" id="fileUploadBox">
      <input type="file" id="fileInput" accept=".mp3,.wav,.ogg,.m4a,.flac,audio/*" />
      <span id="fileLabel">Click to choose an .mp3 or .wav file</span>
    </div>
    <div class="clear-file" id="clearFileBtn">Clear selected file</div>

    <button id="predictBtn">PREDICT ERA</button>

    <div class="error-box" id="errorBox"></div>

    <div class="result-box" id="resultBox">
      <div class="result-era" id="resultEra">2011&ndash;2020</div>
      <div class="result-sub" id="resultSong"></div>

      <div class="confidence-bar-row">
        <span class="confidence-label">&lt;2000</span>
        <div class="confidence-bar-track"><div class="confidence-bar-fill" id="bar-lt2000" style="width:0%;"></div></div>
        <span class="confidence-pct" id="pct-lt2000">0%</span>
      </div>
      <div class="confidence-bar-row">
        <span class="confidence-label">2000&ndash;2010</span>
        <div class="confidence-bar-track"><div class="confidence-bar-fill" id="bar-2000" style="width:0%;"></div></div>
        <span class="confidence-pct" id="pct-2000">0%</span>
      </div>
      <div class="confidence-bar-row">
        <span class="confidence-label">2011&ndash;2020</span>
        <div class="confidence-bar-track"><div class="confidence-bar-fill" id="bar-2011" style="width:0%;"></div></div>
        <span class="confidence-pct" id="pct-2011">0%</span>
      </div>
      <div class="confidence-bar-row">
        <span class="confidence-label">2021+</span>
        <div class="confidence-bar-track"><div class="confidence-bar-fill" id="bar-2021" style="width:0%;"></div></div>
        <span class="confidence-pct" id="pct-2021">0%</span>
      </div>

      <p class="result-para" id="resultPara"></p>
    </div>
  </div>

<script>
  const API_BASE = window.location.protocol === 'file:' ? 'http://127.0.0.1:5000' : '';

  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const fileUploadBox = document.getElementById('fileUploadBox');
  const clearFileBtn = document.getElementById('clearFileBtn');
  const predictBtn = document.getElementById('predictBtn');
  const resultBox = document.getElementById('resultBox');
  const errorBox = document.getElementById('errorBox');
  const songSearch = document.getElementById('songSearch');
  const songSuggestions = document.getElementById('songSuggestions');

  const ERA_FORMAT = {
    '<2000': '<2000',
    '2000-2010': '2000\u20132010',
    '2011-2020': '2011\u20132020',
    '2021+': '2021+'
  };

  const BAR_IDS = {
    '<2000': ['bar-lt2000', 'pct-lt2000'],
    '2000-2010': ['bar-2000', 'pct-2000'],
    '2011-2020': ['bar-2011', 'pct-2011'],
    '2021+': ['bar-2021', 'pct-2021']
  };

  fileUploadBox.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) {
      fileLabel.textContent = fileInput.files[0].name;
      fileUploadBox.classList.add('has-file');
      clearFileBtn.classList.add('visible');
      songSearch.value = '';
    }
  });

  clearFileBtn.addEventListener('click', () => {
    fileInput.value = '';
    fileLabel.textContent = 'Click to choose an .mp3 or .wav file';
    fileUploadBox.classList.remove('has-file');
    clearFileBtn.classList.remove('visible');
  });

  let searchTimer = null;
  songSearch.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const q = songSearch.value.trim();
    if (q.length < 2) return;
    searchTimer = setTimeout(async () => {
      try {
        const res = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(q)}`);
        if (!res.ok) return;
        const data = await res.json();
        songSuggestions.innerHTML = '';
        (data.results || []).forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.display;
          songSuggestions.appendChild(opt);
        });
      } catch (_) {}
    }, 220);
  });

  songSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') predictBtn.click();
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('visible');
    resultBox.classList.remove('visible');
  }

  function renderResult(data) {
    errorBox.classList.remove('visible');
    document.getElementById('resultEra').textContent = ERA_FORMAT[data.predicted_era] || data.predicted_era;

    if (data.source === 'catalog') {
      const yearInfo = data.release_year ? ` (${data.release_year}, actual era: ${ERA_FORMAT[data.actual_era] || data.actual_era})` : '';
      document.getElementById('resultSong').textContent = `Matched: "${data.matched_song}" by ${data.artist}${yearInfo}`;
    } else if (data.source === 'audio_upload') {
      document.getElementById('resultSong').textContent = `Analyzed audio file: "${data.matched_song}"`;
    } else {
      document.getElementById('resultSong').textContent = `Analyzed: "${data.matched_song}"`;
    }

    const probs = data.probabilities || {};
    Object.keys(BAR_IDS).forEach((era) => {
      const pct = Math.round((probs[era] || 0) * 100);
      const [barId, pctId] = BAR_IDS[era];
      document.getElementById(barId).style.width = `${pct}%`;
      document.getElementById(pctId).textContent = `${pct}%`;
    });

    document.getElementById('resultPara').textContent = data.explanation || '';
    resultBox.classList.add('visible');
  }

  predictBtn.addEventListener('click', async () => {
    const hasFile = fileInput.files && fileInput.files.length > 0;
    const query = songSearch.value.trim();

    if (!hasFile && !query) {
      showError('Please enter a song name or choose an audio file first.');
      return;
    }

    predictBtn.disabled = true;
    predictBtn.textContent = 'PREDICTING...';
    errorBox.classList.remove('visible');

    try {
      let response;
      if (hasFile && !query) {
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        response = await fetch(`${API_BASE}/api/predict-audio`, {
          method: 'POST',
          body: formData
        });
      } else {
        response = await fetch(`${API_BASE}/api/predict`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });
      }

      const data = await response.json();
      if (!response.ok) {
        showError(data.error || 'Prediction request failed.');
      } else {
        renderResult(data);
      }
    } catch (err) {
      showError('Could not connect to the Flask backend. Make sure `python src/app.py` is running on port 5000.');
    } finally {
      predictBtn.disabled = false;
      predictBtn.textContent = 'PREDICT ERA';
    }
  });
</script>

</body>
</html>
